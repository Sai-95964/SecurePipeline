name: SecurePipeline CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-pipeline:
    name: Security Testing & Gate
    runs-on: ubuntu-latest
    steps:
      # =========================================================================
      # STAGE 1: SOURCE CHECKOUT & ENVIRONMENT SETUP
      # =========================================================================
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          mkdir -p reports/raw reports

      # =========================================================================
      # STAGE 2: SECURITY TOOL INSTALLATION & VERIFICATION
      # =========================================================================
      - name: Install Semgrep SAST
        run: |
          pip install semgrep==1.95.0

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks
          sudo chmod +x /usr/local/bin/gitleaks

      - name: Install Syft SBOM Generator
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin v1.1.0
          sudo chmod +x /usr/local/bin/syft

      - name: Install Trivy Scanner
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin v0.51.1
          sudo chmod +x /usr/local/bin/trivy

      - name: Verify Security Tool Installations
        run: |
          echo "=== Installed Tool Versions ==="
          python --version
          semgrep --version
          gitleaks version
          syft version
          trivy --version
          docker --version

      # =========================================================================
      # STAGE 3: DOCKER IMAGE BUILD (BEFORE GATE)
      # =========================================================================
      - name: Build Application Docker Image
        id: docker_build
        run: |
          if [ -f sample_app/Dockerfile ]; then
            echo "Building Docker image from sample_app/Dockerfile..."
            docker build -t securepipeline-demo:latest sample_app/
            echo "image_built=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=securepipeline-demo:latest" >> "$GITHUB_OUTPUT"
          elif [ -f Dockerfile ]; then
            echo "Building Docker image from root Dockerfile..."
            docker build -t securepipeline-demo:latest .
            echo "image_built=true" >> "$GITHUB_OUTPUT"
            echo "image_tag=securepipeline-demo:latest" >> "$GITHUB_OUTPUT"
          else
            echo "No Dockerfile found. Container scanning will be skipped."
            echo "image_built=false" >> "$GITHUB_OUTPUT"
            echo "image_tag=" >> "$GITHUB_OUTPUT"
          fi

      # =========================================================================
      # STAGE 4: SECURITY SCANNING VIA SCANNER MANAGER
      # =========================================================================
      - name: Execute Security Scanners
        run: |
          IMAGE_ARG=""
          if [ "${{ steps.docker_build.outputs.image_built }}" = "true" ]; then
            IMAGE_ARG="--image ${{ steps.docker_build.outputs.image_tag }}"
          fi
          
          TARGET_DIR="."
          if [ -d sample_app ]; then
            TARGET_DIR="sample_app"
          fi

          echo "Running ScannerManager against target: $TARGET_DIR"
          python -m scanners.scanner_manager --target "$TARGET_DIR" --output reports/raw $IMAGE_ARG

      # =========================================================================
      # STAGE 5: FINDINGS AGGREGATION & NORMALIZATION
      # =========================================================================
      - name: Aggregate Findings & Extract SBOM
        run: |
          python scripts/aggregate.py --manifest reports/raw/scan_manifest.json --raw-dir reports/raw --output reports/aggregated_findings.json

      # =========================================================================
      # STAGE 6: MANDATORY SECURITY GATE ENFORCEMENT
      # =========================================================================
      - name: Enforce Mandatory Security Gate
        id: security_gate
        run: |
          echo "Executing Mandatory Security Gate..."
          python scripts/security_gate.py --aggregated reports/aggregated_findings.json --manifest reports/raw/scan_manifest.json --output reports/security_gate.json --block-severities "CRITICAL,HIGH"

      # =========================================================================
      # STAGE 7: REPORT GENERATION (Runs always to capture blocking findings)
      # =========================================================================
      - name: Generate Consolidated Security Reports (HTML & JSON)
        if: always()
        run: |
          python scripts/report_generator.py --aggregated reports/aggregated_findings.json --gate reports/security_gate.json --output-dir reports/

      # =========================================================================
      # STAGE 8: ARTIFACT UPLOAD (Always runs, preserving full audit trail)
      # =========================================================================
      - name: Upload Security Reports & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: securepipeline-security-reports
          path: |
            reports/raw/
            reports/*.json
            reports/*.html
          if-no-files-found: warn
          retention-days: 14

  # ===========================================================================
  # STAGE 9: DEPLOYMENT CONTROL (Strictly gated by security-pipeline job)
  # ===========================================================================
  deploy:
    name: Deployment Gating
    needs: security-pipeline
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Demonstration Deployment Approval
        run: |
          echo "=========================================================="
          echo " [SECURE PIPELINE] DEPLOYMENT AUTHORIZED"
          echo " All security scans executed and the security gate passed."
          echo " Promoting build to production / staging environment."
          echo "=========================================================="
